<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operación: MACHUCA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="crewmates" aria-hidden="true"></div>


<div class="wrapper">
      <header>
        <div class="live-badge">
          <span class="live-dot"></span>
          EN VIVO
        </div>
        <h1 class="main-title">OPERACIÓN: <em>MACHUCA</em></h1>
        <p class="subtitle">Transmisión oficial</p>
      </header>

      <section class="countdown-section" aria-label="Cuenta regresiva">
        <div class="countdown">
          <div class="unit">
            <div class="number-box">
              <span class="number" id="days">00</span>
            </div>
            <span class="unit-label">días</span>
          </div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="unit">
            <div class="number-box">
              <span class="number" id="hours">00</span>
            </div>
            <span class="unit-label">horas</span>
          </div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="unit">
            <div class="number-box">
              <span class="number" id="minutes">00</span>
            </div>
            <span class="unit-label">min</span>
          </div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="unit">
            <div class="number-box">
              <span class="number" id="seconds">00</span>
            </div>
            <span class="unit-label">seg</span>
          </div>
        </div>
      </section>

      <section class="phrase-section">
        <div class="phrase-box">
          <p class="phrase" id="phrase"></p>
          <span class="cursor">▮</span>
        </div>
      </section>

      <section class="progress-section">
        <div class="progress-label-row">
          <span class="progress-label">NIVEL DE LIBERTAD ALCANZADO</span>
          <span class="progress-pct" id="progress-pct">0.0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-bar"></div>
          <div class="progress-tip" id="progress-glow"></div>
        </div>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
