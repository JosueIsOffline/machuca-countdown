<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operación: MACHUCA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div class="floating-items" aria-hidden="true">
      <span class="fi" style="--x: 6%; --y: 10%; --s: 1.4; --d: 9s; --r: -8deg"
        >☕</span
      >
      <span class="fi" style="--x: 87%; --y: 8%; --s: 0.9; --d: 12s; --r: 6deg"
        >📋</span
      >
      <span class="fi" style="--x: 12%; --y: 68%; --s: 1.1; --d: 10s; --r: 4deg"
        >✉️</span
      >
      <span
        class="fi"
        style="--x: 80%; --y: 60%; --s: 0.8; --d: 14s; --r: -5deg"
        >📎</span
      >
      <span class="fi" style="--x: 50%; --y: 82%; --s: 1.2; --d: 8s; --r: 10deg"
        >🖨️</span
      >
      <span
        class="fi"
        style="--x: 33%; --y: 14%; --s: 0.75; --d: 15s; --r: -12deg"
        >🗂️</span
      >
      <span class="fi" style="--x: 91%; --y: 75%; --s: 1; --d: 11s; --r: 3deg"
        >💼</span
      >
      <span class="fi" style="--x: 4%; --y: 42%; --s: 1.3; --d: 13s; --r: -6deg"
        >📌</span
      >
      <span class="fi" style="--x: 70%; --y: 22%; --s: 0.7; --d: 16s; --r: 8deg"
        >📟</span
      >
      <span class="fi" style="--x: 22%; --y: 88%; --s: 0.9; --d: 9s; --r: -3deg"
        >🗃️</span
      >
    </div>

    <div class="watermark" aria-hidden="true">CLASIFICADO</div>

    <div class="wrapper">
      <header>
        <div class="live-badge">
          <span class="live-dot"></span>
          EN VIVO
        </div>
        <h1 class="main-title">OPERACIÓN: <em>MACHUCA</em></h1>
        <p class="subtitle">Transmisión oficial</p>
      </header>

      <section class="countdown-section" aria-label="Cuenta regresiva">
        <div class="countdown">
          <div class="unit">
            <div class="number-box">
              <span class="number" id="days">00</span>
            </div>
            <span class="unit-label">días</span>
          </div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="unit">
            <div class="number-box">
              <span class="number" id="hours">00</span>
            </div>
            <span class="unit-label">horas</span>
          </div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="unit">
            <div class="number-box">
              <span class="number" id="minutes">00</span>
            </div>
            <span class="unit-label">min</span>
          </div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="unit">
            <div class="number-box">
              <span class="number" id="seconds">00</span>
            </div>
            <span class="unit-label">seg</span>
          </div>
        </div>
      </section>

      <section class="phrase-section">
        <div class="phrase-box">
          <p class="phrase" id="phrase"></p>
          <span class="cursor">▮</span>
        </div>
      </section>

      <section class="progress-section">
        <div class="progress-label-row">
          <span class="progress-label">NIVEL DE LIBERTAD ALCANZADO</span>
          <span class="progress-pct" id="progress-pct">0.0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-bar"></div>
          <div class="progress-tip" id="progress-glow"></div>
        </div>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
